<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyGuard | Signup</title>
    <link rel="stylesheet" href="css/layout_style.css">
    <link rel="stylesheet" href="css/login_signup_style.css">

</head>
<body>
    <div class="page"> 
        <header class="page_head">
            <div class="head_brand">
                <img id ="web_logo" src="assets/talkthreads-logo.png" alt="TinyGuard logo">
                <h1>TinyGuard</h1>
            </div>

            <nav class="head_nav">
                <a href="index.html">Home</a>
                <a href="fileinput.html">Input file</a>
                <a href="login.html">Login</a>
                <a href="signup.html">Sign Up</a>
                <a href="About.html">About</a>
            </nav>
        </header>
        
        <main>
            <div class="box-container">
                
                <section class="box-card" id="login-border">
                <h2>Create an account</h2>
                
                <p class="login-subtext">Sign up to use TinyGuard</p>   
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="name">Full name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required/>
                    </div>
                    
                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" name="signupEmail" placeholder="Enter your full name" required/>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" name="signupPassword" placeholder="Create a password" required/>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" required/>
                    </div>
                    
                    <label>
                        <input type="radio" name="role" value="child" required />
                        Child
                    </label>
                    <label>
                        <input type="radio" name="role" value="parent" required />
                        Parent
                    </label>
                    <button type="submit" class="loginBtn">Create account</button>
                <p class="switch-auth">
                    Already have an account?
                    <a href="login.html" id="loginlocate">Login here</a>
                </p>
                </form>

            </section>
            </div>
        </main>

    </div>    
    <script type="module" src="scripts/script.js"></script>

</body>
</html>
