<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyGuard | Login</title>
    <link rel="stylesheet" href="css/layout_style.css">
    <link rel="stylesheet" href="css/login_signup_style.css">

</head>
<body>
    <div class="page"> 
        <header class="page_head">
            <div class="head_brand">
                <img id ="web_logo" src="assets/talkthreads-logo.png" alt="TinyGuard logo">
                <h1>TinyGuard</h1>
            </div>

            <nav class="head_nav">
                <a href="index.html">Home</a>
                <a href="fileinput.html">Input file</a>
                <a href="login.html">Login</a>
                <a href="signup.html">Sign Up</a>
                <a href="About.html">About</a>
            </nav>
        </header>
        
        <main>
            <div class="box-container">
                
                <section class="box-card" id="login-border">
                <h2>Sign in</h2>
                
                <p class="login-subtext">Sign in to continue</p>   
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required/>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required/>
                    </div>
                    <button type="submit" class="loginBtn">Login</button>
                </form>
        </main>

    </div>    
    <script type="module" src="scripts/script.js"></script>

</body>
</html>
