<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyGuard || Profile</title>
    <link rel="stylesheet" href="css/layout_style.css">
    <link rel="stylesheet" href="css/login_signup_style.css">
    <script src="https://kit.fontawesome.com/dc4562ddf8.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="page"> 
        <header class="page_head">
            <div class="head_brand">
                <img id="web_logo" src="assets/tinyguard-logo.svg" alt="TinyGuard logo">
                <h1>TinyGuard</h1>
            </div>
            <nav class="head_nav">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <button type="button" id="logoutBtn">Logout</button>
            </nav>
        </header>
        <main>
            <!--ADMIN DASHBOARD-->
            <section id="adminDashboard" class="hidden">
                <h2>Admin Dashboard</h2>

                <h3>Add or Update User</h3>

                <input type="hidden" id="userId">

                <input type="text" id="fullName" placeholder="Full name">
                <input type="email" id="adminEmail" placeholder="Email">
                <input type="password" id="adminPassword" placeholder="Password">

                <select id="roleId">
                    <option value="1">Admin</option>
                    <option value="2">Parent</option>
                    <option value="3">Child</option>
                </select>

                <button id="saveUserBtn" type="button">Save User</button>
                <button id="clearBtn" type="button">Clear</button>
                <input type="text" id="userSearchInput" placeholder="Search users by name or email">
                
                <h3>Users</h3>

                <div class="admin-table-wrapper">
                    <table>
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="usersTableBody"></tbody>
                    </table>
                </div>
            </section>

            <!--PARENT DASHBOARD-->

            <section id="parentDashboard" class="hidden">
                <h2>Parent Dashboard</h2>

                <div id="connectChildBox">
                    <h3>Connect child account</h3>
                    <input type="email" id="childEmail" placeholder="Child email">
                    <button type="button" id="connectChildBtn">Connect child</button>
                    <p id="connectChildMessage"></p>
                </div>

                <h3>Connected children</h3>

                <div id="childrenList"></div>
                <h3>Child statistics</h3>
                <div id="statisticsFilters">
                    <button type="button" data-period="week">Last week</button>
                    <button type="button" data-period="year">Last year</button>
                    <button type="button" data-period="all">All time</button>
                </div>

                <div id="childStatistics">
                    <p>Select a child to view statistics.</p>
                </div>

                <div class="chart-card">
                    <canvas id="badWordsChart"></canvas>
                </div>

            </section>
        </main>  
    </div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="scripts/login_signup_script.js"></script>
<script type="module" src="scripts/parent_child_connect.js"></script>
</body>
</html>
